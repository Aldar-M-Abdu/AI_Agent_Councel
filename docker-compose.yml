services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-decision-council-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-anthropic/claude-3-haiku}
      - MAX_TOKENS=${MAX_TOKENS:-4000}
    volumes:
      - ./backend/discussions:/app/backend/discussions
      - ./backend/reports:/app/backend/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
